<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ar ui</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead">
  <div class="statement">
    <h1 id="domain">Loading the campaign</h1>
    <p id="objective" class="objective"></p>
  </div>
  <dl class="readout" aria-live="polite">
    <div><dt>Best</dt><dd id="best">none yet</dd></div>
    <div><dt>To target</dt><dd id="distance">no distance</dd></div>
    <div><dt>Target</dt><dd id="target">not probed</dd></div>
  </dl>
  <p class="link" id="link" data-state="connecting" title="Live updates">
    <span class="dot" aria-hidden="true"></span><span id="link-text">Connecting</span>
  </p>
</header>

<nav class="tabs" role="tablist" aria-label="Views">
  <button role="tab" id="tab-graph" aria-controls="view-graph" aria-selected="true">Graph</button>
  <button role="tab" id="tab-agents" aria-controls="view-agents" aria-selected="false">Agents</button>
  <button role="tab" id="tab-board" aria-controls="view-board" aria-selected="false">Board</button>
  <button role="tab" id="tab-frontier" aria-controls="view-frontier" aria-selected="false">Frontier</button>
</nav>

<main>
  <section role="tabpanel" id="view-graph" aria-labelledby="tab-graph" class="graph-view">
    <div class="toolbar">
      <input type="search" id="graph-search" placeholder="Find an entry by id, title or hypothesis"
             aria-label="Find an entry" autocomplete="off">
      <span id="search-count" class="muted" aria-live="polite"></span>
      <div id="filter-tracks" class="chips" role="group" aria-label="Tracks"></div>
      <div id="filter-statuses" class="chips" role="group" aria-label="Statuses"></div>
      <button type="button" id="graph-fit">Fit to screen</button>
    </div>
    <p id="focus-bar" class="focus-bar" hidden>Showing only the lineage of <strong id="focus-id"></strong>.
      <button type="button" id="focus-clear">Show everything</button></p>
    <div class="graph-body">
      <div id="graph-canvas" class="canvas" aria-label="Knowledge graph"></div>
      <aside id="panel" class="panel" hidden>
        <button type="button" id="panel-close" class="close" aria-label="Close the panel">Close</button>
        <div id="panel-body"></div>
      </aside>
    </div>
    <p id="graph-count" class="graph-count muted"></p>
  </section>
  <section role="tabpanel" id="view-agents" aria-labelledby="tab-agents" hidden>
    <p class="empty">The agents view is not built yet.</p>
  </section>
  <section role="tabpanel" id="view-board" aria-labelledby="tab-board" hidden>
    <p class="empty">The board view is not built yet. <code>ar board</code> shows the same facts.</p>
  </section>
  <section role="tabpanel" id="view-frontier" aria-labelledby="tab-frontier" hidden>
    <p class="empty">The frontier plot is not built yet.</p>
  </section>
</main>
<p id="error" class="error" role="alert" hidden></p>
<script src="vendor/cytoscape.min.js"></script>
<script src="vendor/dagre.min.js"></script>
<script src="vendor/cytoscape-dagre.js"></script>
<script type="module" src="app.js"></script>
<script type="module" src="graph.js"></script>
</body>
</html>
