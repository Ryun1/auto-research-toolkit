[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch"
version = "0.5.0"
description = "A domain-agnostic autonomous research harness: typed goals, structured hypothesis state, ranked selection, coordinator-driven parallel workers, enforced budgets."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ar = "autoresearch.cli:main"
autoresearch = "autoresearch.cli:main"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E501",  # line length: prose-heavy docstrings and prompts, judged by eye
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoresearch = ["agents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
