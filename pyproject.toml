[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch"
version = "0.1.0"
description = "A domain-agnostic autonomous research harness: typed goals, structured hypothesis state, ranked selection, coordinator-driven parallel workers, enforced budgets."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
ar = "autoresearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoresearch = ["agents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
