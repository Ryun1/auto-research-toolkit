knowledge = ["guides/toy-landscape.md"]

# Distilled skills. Empty in the shipped domain on purpose: a skill cites
# entries, and `state/entries/` here is empty, so a committed skill would cite
# something no checkout has. The tests build them in a sandbox instead.
[skills]
dir       = "docs/skills"
max_lines = 500

[domain]
name = "toy"
description = "A synthetic optimisation domain used to exercise the loop end to end in seconds."
goal = "goal.yaml"

[state]
entries    = "state/entries"
claims     = "state/claims"
runs       = "data/runs"
memos      = "inbox"
iterations = "state/iterations"

[[tracks]]
id     = "research"
prefix = "Q"
title  = "Hypothesis Queue"
view   = "docs/log/Hypothesis Queue.md"
description = "Leads on the score. Nothing here is about the harness."

[[tracks]]
id     = "harness"
prefix = "H"
title  = "Harness Debt"
view   = "docs/log/Harness Debt.md"
description = "The scaffolding's own defects. Kept separate so an agent booting into research never reads harness debt as a lead on the score."
# A defect here must carry `core`, `repro` and `observed` -- see
# `ar harness export`. Validation and export both refuse an entry missing them.
requires_defect_evidence = true
# The harness track closes differently: a defect is fixed or declined, not
# confirmed or refuted.
[tracks.terminal]
fixed   = { requires_evidence = true }
wontfix = { requires_evidence = true }
refuted = { requires_evidence = true, requires_closure_kind = true }

[lanes]
# Default-deny: anything not matching is scaffolding and takes the proposal lane.
# `state/` is enumerated rather than taken whole: state/claims holds the lock,
# which is a single-filesystem primitive whose holder and pid mean nothing on
# another machine. Publishing it hands the next machine a lock it cannot
# diagnose. See .gitignore.
findings = "^(data/runs|data/artifacts|inbox|docs|state/entries|state/iterations)/"

[policy]
spend_ceiling = 5.0
currency = "USD"

[[policy.forbidden_paths]]
pattern = "secrets/*"
reason  = "the toy domain's stand-in for a path that must never be committed"

[[policy.human_only]]
pattern = "toy publish"
reason  = "stand-in for an irreversible outward-facing action; an agent may prepare it, never run it"

[budgets]
claim_wall_clock_hours = 0.25
claim_max_runs         = 40
iteration_fanout       = 4
iteration_max_seconds  = 300
domain_max_runs        = 400

[commands]
measure      = "bin/measure"
probe_target = "bin/probe-target"

[upstream]
# Where the core comes from, for `ar harness check` and `ar harness update`.
url = "https://github.com/Ryun1/auto-research-toolkit"
ref  = "main"


[coordinator]
workers_per_iteration = 3
generators_per_iteration = 2
# Share of each shortlist reserved for the largest `impact`, ignoring confidence
# and cost -- the terms that bury an honest long shot. 0 disables it.
explore_fraction = 0.2
# Distil closed work into skills every N iterations; 0 turns it off.
distil_every = 5

# What each experiment class needs of the machine. Declared so a capacity limit
# surfaces as a REFUSAL before the run, rather than as a truncated measurement
# afterwards -- a run that silently caps its concurrency reports a throughput
# for a configuration nobody chose.
[hardware.cheap-sweep]
min_threads = 2
min_memory_gb = 1.0

[hardware.wide-sweep]
min_threads = 4
gb_per_unit = 0.0076     # memory cost of one concurrent unit
needs_gpu = "any"

# Rentable classes. `measured_ratio` is throughput on that class over throughput
# on the local host, FOR THIS WORKLOAD, at a stated concurrency. Leave it out
# until someone has measured it: a speedup cannot be read off a spec sheet.
[[remote]]
name = "toy-cpu-16core"
usd_per_hour = 0.35
measured_ratio = 2.5
measured_at_concurrency = 8
measured_on = "toy calibration, 2026-08-31"

[[remote]]
name = "toy-gpu-unmeasured"
usd_per_hour = 0.90
notes = "no ratio measured for this workload; cannot be costed"
